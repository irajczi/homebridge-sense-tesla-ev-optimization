# EV Solar Charger — example configuration
#
# Run the interactive setup wizard to generate this file automatically:
#   node packages/cli/dist/index.js
#
# The wizard handles Tesla OAuth authorization and writes config.yaml with
# the correct refresh token. Only edit this file directly if you know what
# you are doing.
#
# The config path can be overridden with the EV_CONFIG_PATH environment variable.

# ── Sense Energy Monitor ──────────────────────────────────────────────────────
sense:
  # Email address registered to your Sense account.
  email: "you@example.com"

  # Sense account password.
  password: "your-sense-password"

# ── Tesla Fleet API ───────────────────────────────────────────────────────────
tesla:
  # Client ID (UUID) of your registered Tesla Fleet API application.
  # Obtain from developer.tesla.com.
  fleet_client_id: "12345678-1234-1234-1234-123456789abc"

  # Client secret of your registered Tesla Fleet API application.
  fleet_api_key: "your-fleet-api-client-secret"

  # OAuth2 refresh token for your Tesla account.
  # Generated automatically by the setup wizard via the Authorization Code flow.
  # The app updates this value automatically if Tesla rotates the token.
  refresh_token: "your-tesla-oauth2-refresh-token"

  # Tesla account email address (optional).
  # email: "you@tesla.com"

  # Vehicle Identification Number (optional).
  # If omitted, the first vehicle on the account is used.
  # Specify this if you have more than one Tesla on the account.
  # vin: "5YJ3E1EA1JF000001"

# ── Charging ──────────────────────────────────────────────────────────────────
charging:
  # Minimum charging rate in amps (1–48, whole number).
  # Charging starts only when surplus supports at least this many amps.
  # If stop_when_insufficient is true, charging stops when surplus drops below this.
  # Typical Tesla minimum is 5A.
  min_amps: 5

  # Maximum charging rate in amps (1–48, whole number, must be >= min_amps).
  # Match this to your EVSE's rated capacity (e.g. 32A for a 7.7 kW charger).
  max_amps: 32

  # How often to read Sense and adjust the charge rate, in seconds (>= 10).
  # 60 s is a good default; 30 s reacts faster to changing conditions.
  poll_interval_seconds: 60

  # Whether to stop charging when surplus drops below min_amps.
  # true  — stops the session; restarts automatically when surplus recovers.
  # false — keeps charging at min_amps even if it draws a little grid power.
  stop_when_insufficient: true

# ── Homebridge integration (optional) ─────────────────────────────────────────
# Remove this section when running the CLI standalone without the Homebridge plugin.
# homebridge:
#   # Turn the virtual switch off after this many minutes with no solar production.
#   # Set to null to disable. Valid values: positive whole number, or null.
#   auto_off_after_no_solar_minutes: 30
