<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EV Solar Charger — Tesla Authorization</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #f5f5f5;
      margin: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
    }
    .card {
      background: white;
      border-radius: 12px;
      padding: 40px;
      max-width: 560px;
      width: 90%;
      box-shadow: 0 2px 16px rgba(0,0,0,0.1);
    }
    h1 { margin: 0 0 8px; font-size: 22px; color: #111; }
    .status { font-size: 15px; color: #444; margin-bottom: 28px; }
    .status.error { color: #c0392b; }
    label { font-size: 13px; font-weight: 600; color: #555; display: block; margin-bottom: 6px; }
    .url-box {
      background: #f0f0f0;
      border-radius: 8px;
      padding: 14px 16px;
      font-family: monospace;
      font-size: 12px;
      word-break: break-all;
      color: #222;
      margin-bottom: 16px;
      line-height: 1.5;
    }
    button {
      background: #3b82f6;
      color: white;
      border: none;
      border-radius: 8px;
      padding: 11px 22px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      width: 100%;
    }
    button:hover { background: #2563eb; }
    button.copied { background: #16a34a; }
    .step {
      background: #f8f9fa;
      border-left: 3px solid #3b82f6;
      border-radius: 4px;
      padding: 12px 16px;
      font-size: 13px;
      color: #444;
      margin-top: 20px;
      line-height: 1.6;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>Tesla Authorization</h1>
    <div id="status" class="status"></div>

    <div id="success-section" style="display:none">
      <label>Copy this full URL and paste it into the terminal:</label>
      <div id="url-display" class="url-box"></div>
      <button id="copy-btn" onclick="copyUrl()">Copy URL</button>
      <div class="step">
        Go back to your terminal and paste this URL when prompted.<br>
        The setup wizard will extract the authorization code automatically.
      </div>
    </div>

    <div id="error-section" style="display:none">
      <div class="step">
        It looks like authorization was not completed. Close this tab, re-run
        the setup wizard, and try again.
      </div>
    </div>
  </div>

  <script>
    var fullUrl = window.location.href;
    var params = new URLSearchParams(window.location.search);
    var code = params.get('code');
    var error = params.get('error');

    if (code) {
      document.getElementById('status').textContent = 'Authorization successful. Copy the URL below.';
      document.getElementById('url-display').textContent = fullUrl;
      document.getElementById('success-section').style.display = 'block';
    } else if (error) {
      document.getElementById('status').textContent = 'Authorization failed: ' + error;
      document.getElementById('status').className = 'status error';
      document.getElementById('error-section').style.display = 'block';
    } else {
      document.getElementById('status').textContent = 'No authorization code found in URL.';
      document.getElementById('status').className = 'status error';
      document.getElementById('error-section').style.display = 'block';
    }

    function copyUrl() {
      navigator.clipboard.writeText(fullUrl).then(function() {
        var btn = document.getElementById('copy-btn');
        btn.textContent = 'Copied!';
        btn.className = 'copied';
        setTimeout(function() {
          btn.textContent = 'Copy URL';
          btn.className = '';
        }, 2000);
      });
    }
  </script>
</body>
</html>
